workspace:
  root_path: "."

agent:
  max_iterations: 5
  verbose: true

environments:
  external:
    llm:
      provider: codex_cli
      model: "gpt-5.6-terra"
      timeout_seconds: 120
    storage:
      provider: memory

  external-sj:
    llm:
      provider: openai_compatible
      base_url: "https://api.openai.com/v1"
      model: "gpt-4o-mini"
      api_key: "${OPENAI_API_KEY}"
      temperature: 0.1
      timeout_seconds: 120
      max_tokens: 2048
      max_retries: 2
    storage:
      provider: memory

  internal:
    llm:
      provider: openai_compatible
      base_url: "내부모델주소"
      model: "gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
      api_key: "not-needed"
      temperature: 0.1
      timeout_seconds: 120
      max_tokens: 2048
      max_retries: 2
    storage:
#      provider: "postgres"
#      url_env: "KCS_DATABASE_URL"
       provider: memory

mcp:
  server_url: ""
  timeout_seconds: 30


