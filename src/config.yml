workspace:
  root_path: "."

agent:
  max_iterations: 5
  verbose: true

environments:
  external:
    llm:
      provider: codex_cli
      model: "gpt-5.6-luna"
      timeout_seconds: 120
    storage:
      provider: memory

  internal:
    llm:
      provider: openai_compatible
      base_url: "내부모델주소"
      model: "gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
      api_key: "not-needed"
      temperature: 0.1
      timeout_seconds: 120
      max_tokens: 2048
      max_retries: 2
    storage:
      provider: "postgres"
      url_env: "postgres 컨테이너 주소"

mcp:
  server_url: ""
  timeout_seconds: 30



